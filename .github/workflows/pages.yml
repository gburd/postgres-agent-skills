name: Build & deploy skills catalog to GitHub Pages

# The catalog is generated from the skill files by tools/build-catalog.py.
# Skills are written once for every agent on a single branch (main); there are
# no per-agent branches. Build from main on push, and allow manual runs.

on:
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
      - "postgres/**"
      - "tooling/**"
      - "ai-life-skills/**"
      - "steering/**"
      - "tools/build-catalog.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate catalog
        run: python3 tools/build-catalog.py site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
